name: Check GitHub IDs

on:
  push:
    branches:
      - main

jobs:
  check-ids:
    runs-on: ubuntu-latest
    steps:
      - name: Print User ID and Repository ID
        run: |
          echo "=== GitHub Context IDs ==="
          echo "User (Owner) ID : ${{ github.repository_owner_id }}"
          echo "Repository ID   : ${{ github.repository_id }}"
          echo "=========================="